name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 윈도우를 여기서 돌리지 않으면 경로 구분자·인코딩·실행 권한 같은
        # 플랫폼 차이가 릴리스 빌드에 가서야 드러난다 (실제로 그랬다).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Qt 시스템 라이브러리 (리눅스)
        if: matrix.os == 'ubuntu-latest'
        # PySide6 휠에는 libEGL 같은 시스템 라이브러리가 들어 있지 않다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: 린트
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff check .
          ruff format --check .
      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen      # 화면 없는 러너에서도 위젯을 만들 수 있다
        run: pytest -q
