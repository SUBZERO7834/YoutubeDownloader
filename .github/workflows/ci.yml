name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 윈도우를 여기서 돌리지 않으면 경로 구분자·인코딩·실행 권한 같은
        # 플랫폼 차이가 릴리스 빌드에 가서야 드러난다 (실제로 그랬다).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 린트
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff check .
          ruff format --check .
      - name: 테스트
        run: pytest -q
