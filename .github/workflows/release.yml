name: 실행 파일 빌드

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    tags: ["v*"]              # 태그를 밀면 릴리스까지

permissions:
  contents: write             # 태그 빌드에서 릴리스 생성에 필요

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (x86_64)
            asset: ytdl4k-linux-x86_64
            built: dist/ytdl4k
            gui_asset: ytdl4k-gui-linux-x86_64
          - os: windows-latest
            label: Windows (x86_64)
            asset: ytdl4k-windows-x86_64.exe
            built: dist/ytdl4k.exe
            gui_asset: ytdl4k-gui-windows-x86_64
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset: ytdl4k-macos-arm64
            built: dist/ytdl4k
            gui_asset: ytdl4k-gui-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Qt 시스템 라이브러리 (리눅스)
        if: matrix.os == 'ubuntu-latest'
        # PySide6 휠에는 libEGL 같은 시스템 라이브러리가 들어 있지 않다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: ffmpeg 준비
        shell: bash
        # 반드시 static 빌드여야 한다. 러너에 깔린 ffmpeg 은 동적 링크라
        # 함께 묶어도 다른 PC 에서 공유 라이브러리를 못 찾아 실패한다.
        run: |
          python scripts/fetch_ffmpeg.py || python scripts/fetch_ffmpeg.py --from-pypi

      - name: 빌드 (명령줄)
        run: python scripts/build.py

      - name: 빌드 (창 화면)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build.py --gui --no-clean

      - name: 이름 정리
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

      # 창 화면은 폴더 하나가 통째로 결과물이다. upload-artifact 가 zip 으로 묶어 준다.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_asset }}
          path: dist/ytdl4k-gui
          if-no-files-found: error

      - name: 릴리스에 첨부 (태그 빌드만)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 태그를 밀어도 릴리스는 자동 생성되지 않으므로 없으면 먼저 만든다.
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" "out/${{ matrix.asset }}" --clobber
